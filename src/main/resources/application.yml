server:
  port: 8083

spring:
  application:
    name: request-service

  datasource:
    url: jdbc:postgresql://localhost:5432/request_system
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history_request
    baseline-on-migrate: true
    baseline-version: 0

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      group-id: request-service-group
      properties:
        spring.json.type.mapping: "com.example.request_routing_service.messaging.event.EventDto:com.example.request_service.messaging.event.EventDto"
        spring.json.trusted.packages: "com.example.request_routing_service.messaging.event"
    listener:
      ack-mode: manual

logging:
  level:
    root: info
    com.example: debug
    org.springframework: warn

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"